.chips{flex-wrap:wrap}
.chips{display:flex;gap:8px;margin:2px 0 12px}.chip{border:1px solid var(--ln);background:var(--card);color:var(--mu);padding:7px 12px;border-radius:999px;font:600 13px system-ui,sans-serif}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}

.plan{margin-top:10px;padding:10px;border-radius:12px;background:var(--bg)}.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center}.pl b{display:block;font-size:15px}.pl span{font-size:12px;color:var(--mu)}
.fxr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}.fxr select{margin-bottom:0}.fxr .b{height:46px;padding:0 12px;font-size:18px}
.fxq{margin-top:12px}.fxq .big{font-size:15px}

h1{letter-spacing:-.02em}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(11,21,48,.04),0 8px 20px rgba(11,21,48,.04)}
.b,.chip,.tap,.ck,.kp button{transition:transform .15s,background .2s}.tap:active,.b:active,.chip:active,.ck:active,.kp button:active{transform:scale(.96)}
.b.p,.fab,.chip.on,.kp .eq{color:var(--on)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--hg);box-shadow:0 16px 36px var(--sh)}
.hero .hs{margin-top:8px;opacity:.9}.dn{width:100px;height:100px;flex:none}.dn .t{fill:none;stroke:rgba(255,255,255,.25);stroke-width:9}.dn .v{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}.dn text{fill:#fff;font:800 19px system-ui,sans-serif}
.split{display:flex;gap:4px;height:10px;margin:-2px 0 12px}.split i{border-radius:6px;transform-origin:left}.split .g{background:var(--ok)}.split .r{background:var(--bad)}
nav{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{transition:color .2s}nav button svg{transition:transform .25s}nav button.on svg{transform:translateY(-2px) scale(1.15)}
.seg{position:sticky;top:0;z-index:5}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes ring{from{stroke-dashoffset:var(--L)}}
@keyframes fade{from{opacity:0}}
@keyframes sl{from{transform:translateY(100%)}}
.an>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.an>*:nth-child(2){animation-delay:.06s}.an>*:nth-child(3){animation-delay:.12s}.an>*:nth-child(4){animation-delay:.18s}.an>*:nth-child(5){animation-delay:.24s}.an>*:nth-child(n+6){animation-delay:.3s}
.an .bar i,.an .split i{transform-origin:left;animation:grow .9s .15s cubic-bezier(.2,.8,.2,1) both}

.an .dn .v{animation:ring 1.1s .1s cubic-bezier(.2,.8,.2,1)}
.bd{animation:fade .2s}.sheet{animation:sl .28s cubic-bezier(.2,.8,.2,1)}

.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.chips.wr{flex-wrap:wrap}.acc{margin-top:12px}.acc .lb{margin:10px 0 6px}.pv{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--ln);border-radius:12px;margin-top:6px}.pv .sw{display:flex;gap:4px}.pv .sw i{width:14px;height:14px;border-radius:50%;display:block}
/* Disleksi yazı modları */
html[data-font] *{font-family:Verdana,"Trebuchet MS","Comic Sans MS","Atkinson Hyperlegible",Lexend,Tahoma,sans-serif!important;letter-spacing:.04em!important;word-spacing:.12em!important;font-style:normal!important}
html[data-font] body{line-height:1.7}

html[data-font] .lb,html[data-font] li{line-height:1.65}
html[data-font="dys2"] *{letter-spacing:.07em!important;word-spacing:.2em!important}
html[data-font="dys2"] body{zoom:1.12;line-height:1.85}
/* Renk körlüğü modları */
:root[data-cb="rg"]{--ok:#0072B2;--bad:#D55E00;--ac:#0072B2}
:root[data-cb="by"]{--ok:#0f8a6b;--bad:#d6336c;--ac:#0f8a6b;--ac2:#7c3aed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-cb="rg"]{--ok:#56B4E9;--bad:#E69F00;--ac:#56B4E9}:root:not([data-theme="light"])[data-cb="by"]{--ok:#4fd1a8;--bad:#ff7aa8;--ac:#4fd1a8;--ac2:#9db8ff}}
:root[data-theme="dark"][data-cb="rg"]{--ok:#56B4E9;--bad:#E69F00;--ac:#56B4E9}
:root[data-theme="dark"][data-cb="by"]{--ok:#4fd1a8;--bad:#ff7aa8;--ac:#4fd1a8;--ac2:#9db8ff}
/* renge bağımlı olmayan ek işaretler */
:root[data-cb] .ck.on{outline:3px solid var(--tx);outline-offset:-6px}
:root[data-cb] .late{border-width:2px;border-style:dashed}
/* PIN kilidi */
.lk{max-width:360px;margin:0 auto;text-align:center;padding-top:6vh}.lk h1{font-size:26px;margin:0 0 6px}
.pd{display:flex;justify-content:center;gap:16px;margin:20px 0 6px}.pd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu);display:block}.pd i.on{background:var(--ac);border-color:var(--ac)}.pd.sh{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:12px auto}.pk button{padding:18px 0;font:600 24px system-ui,sans-serif;border:1px solid var(--ln);border-radius:20px;background:var(--card);color:var(--tx)}.pk button:active{transform:scale(.95)}.pk button:disabled{opacity:.4}
/* Kapatma planı */
.tag{font:700 11px system-ui,sans-serif;padding:3px 9px;border-radius:999px;background:var(--ok);color:var(--on)}.card.rec{border:2px solid var(--ok)}
.chips.seg{overflow-x:auto;scrollbar-width:none}.chips.seg .chip{flex:none;white-space:nowrap}

body{background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%) fixed,var(--bg);font-feature-settings:"tnum","ss01";-webkit-font-smoothing:antialiased}

:root{--bg:#f4f6fb;--card:#fff;--tx:#0b1530;--mu:#5d6b88;--ln:#dfe5f1;--ac:#2446b8;--ac2:#c9a24b;--ok:#0f9d73;--bad:#b3122f;--bar:#dfe5f1;--on:#fff;--hg:linear-gradient(135deg,#0a1740,#14307f 60%,#2446b8);--gd:#ffd27a;--sh:rgba(10,23,64,.14)}

  it.forEach(x=>{if(!x.c&&x.bal<=0.005){x.c=k;x.bal=0;freed+=x.pay}});
  if(k===1)it.forEach(x=>{x.b1=x.bal});
